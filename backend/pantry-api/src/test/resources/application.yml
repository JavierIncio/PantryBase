spring:
  application:
    name: pantry-api
  datasource:
    url: jdbc:postgresql://localhost:5432/pantrybase
    username: pantry
    password: pantry
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    access-ttl: 15m
    refresh-ttl: 7d
  security:
    cookie:
      secure: false
    oauth2:
      redirect-uri: http://localhost:4200/oauth2/callback
  rate-limit:
    capacity: 10
    refill-interval-millis: 1000
    excluded-paths:
      - /actuator/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /v3/api-docs/**
      - /api/auth/logout