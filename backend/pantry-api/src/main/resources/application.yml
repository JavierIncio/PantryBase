spring:
  application:
    name: pantry-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pantrybase}
    username: ${DB_USER:pantry}
    password: ${DB_PASSWORD:pantry}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
  ai:
    # Spring AI wires the local, free Ollama model; no API key required.
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  mail:
    host: ${MAIL_HOST:mailpit}
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers,circuitbreakerevents,ratelimiters,retryevents
  endpoint:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true
    retryevents:
      enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        recordExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
      ollamaBase:
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 40
        waitDurationInOpenState: 60s
    instances:
      ollama:
        baseConfig: ollamaBase
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 2s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
      ollamaBase:
        maxAttempts: 2
        waitDuration: 5s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
    instances:
      ollama:
        baseConfig: ollamaBase
  ratelimiter:
    configs:
      default:
        limitForPeriod: 10
        limitRefreshPeriod: 60s
        timeoutDuration: 5s
      ollamaBase:
        limitForPeriod: 5
        limitRefreshPeriod: 60s
    instances:
      ollama:
        baseConfig: ollamaBase
  timelimiter:
    configs:
      default:
        timeoutDuration: 30s
        cancelRunningFuture: true
      ollamaBase:
        timeoutDuration: 60s
    instances:
      ollama:
        baseConfig: ollamaBase

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl: 15m
    refresh-ttl: 7d
  ai:
    # Free, local models only. Credentials/endpoints live under spring.ai.ollama.
    providers:
      - type: OLLAMA
        model: llama3.1:8b
  security:
    cookie:
      secure: false
    oauth2:
      redirect-uri: http://localhost:4200/auth/callback
  rate-limit:
    capacity: 10
    refill-interval-millis: 1000
    excluded-paths:
      - /actuator/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /v3/api-docs/**
      - /api/auth/logout
  mail:
    from: ${MAIL_FROM:notifications@pantrybase.com}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  catalog:
    fdc:
      api-key: ${USDA_FDC_API_KEY:DEMO_KEY}
      base-url: https://api.nal.usda.gov/fdc/v1
      data-types:
        - Foundation
        - SR Legacy
      page-size: 20
      connect-timeout: 2s
      read-timeout: 5s
      cache-ttl: 24h
      max-stale: 30d
  recipe:
    refresh-ttl: 24h
