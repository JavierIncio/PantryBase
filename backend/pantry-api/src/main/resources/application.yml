spring:
  application:
    name: pantry-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pantrybase}
    username: ${DB_USER:pantry}
    password: ${DB_PASSWORD:pantry}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
  mail:
    host: ${MAIL_HOST:mailpit}
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl: 15m
    refresh-ttl: 7d
  security:
    cookie:
      secure: false
    oauth2:
      redirect-uri: http://localhost:4200/auth/callback
  rate-limit:
    capacity: 10
    refill-interval-millis: 1000
    excluded-paths:
      - /actuator/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /v3/api-docs/**
      - /api/auth/logout
  mail:
    from: ${MAIL_FROM:notifications@pantrybase.com}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
