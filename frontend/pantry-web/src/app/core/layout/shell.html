<mat-toolbar
  color="primary"
  class="shell-toolbar"
>
  <a
    class="shell-brand"
    routerLink="/pantry"
    aria-label="PantryBase home"
  >
    <mat-icon aria-hidden="true">kitchen</mat-icon>
    <span>PantryBase</span>
  </a>

  <nav
    class="shell-nav"
    aria-label="Main navigation"
  >
    @for (item of navItems; track item.route) {
    <a
      mat-button
      class="shell-nav-link"
      [routerLink]="item.route"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: false }"
    >
      <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
      <span>{{ item.label }}</span>
    </a>
    }
  </nav>

  <!-- Pushes the user area to the right edge of the toolbar. -->
  <span class="shell-toolbar-spacer"></span>

  <!--
    The menu panel is rendered by the CDK in an overlay attached to <body>,
    outside this component's view encapsulation. Its look is therefore
    styled globally via `panelClass` -> `.shell-user-menu` in styles.scss,
    while the toolbar button below stays component-scoped.
  -->
  <button
    mat-button
    class="shell-user-button"
    [matMenuTriggerFor]="userMenu"
    aria-label="User menu"
  >
    <span class="shell-username">{{ userName() }}</span>
    <mat-icon>arrow_drop_down</mat-icon>
  </button>

  <mat-menu
    #userMenu="matMenu"
    panelClass="shell-user-menu"
  >
    <a
      mat-menu-item
      routerLink="/profile"
    >
      <mat-icon>person</mat-icon>
      <span>Profile</span>
    </a>
    <button
      mat-menu-item
      class="logout-item"
      (click)="logout()"
    >
      <mat-icon>logout</mat-icon>
      <span>Log out</span>
    </button>
  </mat-menu>
</mat-toolbar>

<main class="shell-content">
  <router-outlet />
</main>
