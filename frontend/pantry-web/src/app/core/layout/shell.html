<mat-sidenav-container class="shell">
  <mat-sidenav
    [mode]="sidenavMode()"
    [opened]="sidenavOpened()"
    (openedChange)="sidenavOpened.set($event)"
    class="shell-sidenav"
  >
    <div class="shell-brand">
      <mat-icon aria-hidden="true">kitchen</mat-icon>
      <span>PantryBase</span>
    </div>
    <mat-nav-list>
      @for (item of navItems; track item.route) {
        <a
          mat-list-item
          [routerLink]="item.route"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: false }"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button mat-icon-button (click)="toggleSidenav()" aria-label="Toggle navigation">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="shell-toolbar-title">PantryBase</span>
      <span class="shell-toolbar-spacer"></span>
      <button
        mat-button
        class="shell-user-button"
        [matMenuTriggerFor]="userMenu"
        aria-label="User menu"
      >
        <mat-icon>account_circle</mat-icon>
        <span class="shell-username">{{ userName() }}</span>
        <mat-icon>arrow_drop_down</mat-icon>
      </button>
    </mat-toolbar>

    <!--
      The menu panel is rendered by the CDK in an overlay attached to <body>,
      outside this component's view encapsulation. Its look is therefore
      styled globally via `panelClass` -> `.shell-user-menu` in styles.scss,
      while the toolbar button below stays component-scoped.
    -->
    <mat-menu #userMenu="matMenu" panelClass="shell-user-menu">
      <a mat-menu-item routerLink="/profile">
        <mat-icon>person</mat-icon>
        <span>Perfil</span>
      </a>
      <button mat-menu-item class="logout-item" (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Cerrar sesión</span>
      </button>
    </mat-menu>

    <main class="shell-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
