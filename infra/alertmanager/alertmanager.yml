# Routes every alert to Mailpit so the delivery path can be exercised end to end
# locally (readable at http://localhost:8025). smtp_require_tls stays off because
# Mailpit speaks plain SMTP on 1025. Before a real deployment, swap the receiver for
# a real provider and point smtp_smarthost at it.
global:
  smtp_smarthost: "mailpit:1025"
  smtp_from: "alertmanager@pantrybase.local"
  smtp_require_tls: false

route:
  receiver: local-mailpit
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h

receivers:
  - name: local-mailpit
    email_configs:
      - to: "ops@pantrybase.local"
